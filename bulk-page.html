<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKU Finder - Bulk Upload</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 flex items-center justify-center">

  <div class="max-w-xl w-full space-y-6">

    <!-- Header Navigation -->
    <div class="flex items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
      <div>
        <h1 class="text-xl font-bold text-gray-900">Bulk SKU Uploader</h1>
        <p class="text-xs text-gray-500">Upload Excel or CSV files</p>
      </div>
      <a href="index.html" class="text-xs font-semibold text-gray-600 hover:text-indigo-600 flex items-center gap-1 transition">
        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
      </a>
    </div>

    <!-- Excel Upload Card -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 space-y-4">
      
      <div>
        <label class="block text-xs font-semibold text-gray-700 mb-2">Select File (.xlsx, .xls, .csv)</label>
        <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" 
          class="block w-full text-sm text-gray-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer border border-gray-200 rounded-xl">
      </div>

      <button onclick="handleExcelUpload()" id="upload-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 px-6 rounded-xl flex items-center justify-center gap-2 transition">
        <i data-lucide="upload-cloud" class="w-5 h-5"></i> Upload Data
      </button>

      <!-- Status Feedback -->
      <div id="bulk-progress" class="hidden p-4 rounded-xl text-sm font-medium"></div>

    </div>

    <!-- Inventory Counter -->
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500 font-medium">Total Products in Database</p>
        <p id="total-count" class="text-3xl font-extrabold text-gray-900 mt-1">0</p>
      </div>
      <i data-lucide="database" class="w-8 h-8 text-gray-300"></i>
    </div>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCCvVLVvphi5VLk30MMiOyvX_HuDG7HdHU",
      authDomain: "sku-finder-756b7.firebaseapp.com",
      databaseURL: "https://sku-finder-756b7-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "sku-finder-756b7",
      storageBucket: "sku-finder-756b7.firebasestorage.app",
      messagingSenderId: "533564999771",
      appId: "1:533564999771:web:f9a22330ea6a139d40d77e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const productsRef = ref(db, 'products');

    let existingSkus = new Set();

    onValue(productsRef, (snapshot) => {
      const data = snapshot.val();
      existingSkus.clear();

      if (data) {
        Object.values(data).forEach(item => {
          if (item && item.sku) {
            existingSkus.add(item.sku.toUpperCase());
          }
        });
      }

      document.getElementById('total-count').innerText = existingSkus.size.toLocaleString();
    });

    function cleanSkuFormat(rawSku) {
      if (!rawSku) return null;
      const str = String(rawSku).trim().toUpperCase();
      const match = str.match(/^[A-Z]{2}\d+/);
      return match ? match[0] : null;
    }

    window.handleExcelUpload = function() {
      const fileInput = document.getElementById('excel-file-input');
      const file = fileInput.files[0];

      if (!file) {
        alert("Please select a file first!");
        return;
      }

      showProgress("Processing file...", "amber");

      const reader = new FileReader();

      reader.onload = async function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet);

          if (rows.length === 0) {
            showProgress("File is empty!", "red");
            return;
          }

          const updates = {};
          const seenInFile = new Set();
          let addedCount = 0;
          let duplicateCount = 0;

          rows.forEach(row => {
            const skuKey = Object.keys(row).find(k => k.trim().toUpperCase() === 'SKU');
            const linkKey = Object.keys(row).find(k => k.trim().toUpperCase() === 'LINK' || k.trim().toUpperCase() === 'TARGETED LINK');

            if (skuKey && linkKey && row[skuKey] && row[linkKey]) {
              const baseSku = cleanSkuFormat(row[skuKey]);
              const link = String(row[linkKey]).trim();

              if (!baseSku) return;

              if (seenInFile.has(baseSku) || existingSkus.has(baseSku)) {
                duplicateCount++;
                return;
              }

              seenInFile.add(baseSku);
              const nodeKey = baseSku.replace(/[.#$/\[\]]/g, "_");

              updates[`products/${nodeKey}`] = {
                sku: baseSku,
                link: link,
                createdAt: Date.now()
              };

              addedCount++;
            }
          });

          if (addedCount === 0) {
            showProgress(`No new SKUs added (${duplicateCount} duplicates skipped).`, "red");
            return;
          }

          showProgress(`Uploading ${addedCount.toLocaleString()} SKUs...`, "amber");

          await update(ref(db), updates);

          showProgress(`Success! Added ${addedCount.toLocaleString()} SKUs. (${duplicateCount} duplicates skipped)`, "green");
          fileInput.value = '';

        } catch (err) {
          showProgress("Upload failed: " + err.message, "red");
        }
      };

      reader.readAsArrayBuffer(file);
    };

    function showProgress(msg, color) {
      const progressDiv = document.getElementById('bulk-progress');
      progressDiv.classList.remove('hidden', 'bg-amber-50', 'text-amber-800', 'border-amber-200', 'bg-red-50', 'text-red-800', 'border-red-200', 'bg-green-50', 'text-green-800', 'border-green-200');

      let colorClasses = '';
      if (color === 'amber') colorClasses = 'bg-amber-50 text-amber-800 border border-amber-200';
      if (color === 'red') colorClasses = 'bg-red-50 text-red-800 border border-red-200';
      if (color === 'green') colorClasses = 'bg-green-50 text-green-800 border border-green-200';

      progressDiv.className = `p-4 rounded-xl text-sm font-medium ${colorClasses}`;
      progressDiv.innerText = msg;
    }

    document.addEventListener('DOMContentLoaded', () => lucide.createIcons());
  </script>
  <script>
    // Disable right-click menu
document.addEventListener('contextmenu', (e) => e.preventDefault());

// Block common DevTools shortcuts
document.addEventListener('keydown', (e) => {
  if (
    e.key === 'F12' ||
    (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
    (e.ctrlKey && e.key === 'U')
  ) {
    e.preventDefault();
  }
});
    // 3. DevTools Pause / Freeze Loop (Anti-Debugging)
  (function () {
    function blockDevTools() {
      const startTime = performance.now();
      
      // Infinite Debugger Trigger
      (function () {
        return false;
      })
      ["constructor"]("debugger")();

      const endTime = performance.now();

      // Agar DevTools open hoga, toh performance time slow ho jayega
      if (endTime - startTime > 100) {
        document.body.innerHTML = `
          <div style="height:100vh; display:flex; justify-content:center; align-items:center; background:#1e293b; color:#fff; font-family:sans-serif; text-align:center; padding:20px;">
            <div>
              <h1 style="font-size:2rem; font-weight:bold; color:#ef4444; margin-bottom:10px;">DevTools Detected</h1>
              <p style="color:#94a3b8;">Access is restricted. Please close Developer Tools to resume.</p>
            </div>
          </div>
        `;
      }
    }

    // Run interval continuously
    setInterval(blockDevTools, 100);
  })();
  </script>
</body>
</html>
